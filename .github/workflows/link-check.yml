# Checks every link in the Markdown files with lychee. Runs weekly too, because a link can
# break without any change in this repository. lychee runs as an image pinned by digest.
# For a link that blocks bots or needs a login, add a regular expression to .lycheeignore.
name: link-check

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["**/*.md", ".lycheeignore", ".github/workflows/link-check.yml"]

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # lychee 0.24.2. 429 counts as alive, because a rate limit says nothing about the link.
      # GITHUB_TOKEN lifts the GitHub API rate limit for github.com links.
      - name: lychee
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo --env GITHUB_TOKEN \
            lycheeverse/lychee@sha256:eaff3e0a13603c9a701accfcc84f44158bb77bf36ecfa4622b626056c3463892 \
            --no-progress --accept "200..=299,429" --max-retries 3 --include-fragments --hidden \
            --exclude-path node_modules --exclude-path coverage --exclude-path .claude "./**/*.md"
