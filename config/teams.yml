# Example team config for review-router.
# The action selects the section matching the repo's GitHub org at runtime.
#
# For production use, store your config in a private repo and set the
# config-repo input. See docs/setup/external-config.md for details.

orgs:
  acme-corp:
    teams:
      frontend:
        label: "Needs Review: Frontend"
        slack_channel: ""
      backend:
        label: "Needs Review: Backend"
        slack_channel: ""
      platform:
        label: "Needs Review: Platform"
        slack_channel: ""
