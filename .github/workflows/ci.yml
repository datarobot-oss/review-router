name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Check dist/ freshness
        id: dist-check
        run: |
          if [ -z "$(git diff --name-only dist/)" ]; then
            echo "dist/ is up to date"
            exit 0
          fi

          IS_FORK="${{ github.event.pull_request.head.repo.full_name != github.repository }}"
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "$IS_FORK" = "true" ]; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat dist/
            exit 1
          fi

          echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"

      - name: Generate App token
        if: steps.dist-check.outputs.needs_rebuild == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.REVIEW_ROUTER_APP_ID }}
          private-key: ${{ secrets.REVIEW_ROUTER_APP_PRIVATE_KEY }}

      - name: Auto-rebuild and push dist/
        if: steps.dist-check.outputs.needs_rebuild == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git"
          git add dist/
          git commit -m "chore: rebuild dist"
          git push
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
