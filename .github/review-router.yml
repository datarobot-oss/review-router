# Policy of the Review Router gate: what may pass without a person's approval.
# Reference: docs/setup/gate.md
dependabot:
  allowed_paths:
    - package.json
    - package-lock.json
  max_changed_files: 3
  defaults:
    update_types: [patch, minor]
    min_compatibility: 70
    # A runtime or indirect update changes the shipped bundle, so a person reviews it.
    dependency_types: [direct:development]
