name: "Review Router"
description: "Routes code reviews based on CODEOWNERS when Ready for Review label is applied"

inputs:
  github-token:
    description: "GitHub token for API calls. Use a GitHub App installation token for full functionality. When empty, the action exits gracefully (useful for fork PR events where secrets are unavailable)."
    required: false
  slack-token:
    description: "Slack Bot token for sending notifications (optional)"
    required: false
  jira-token:
    description: >
      Jira API token for fetching ticket titles (optional). Value must be the
      Basic-auth pair "email:api_token" (e.g. "jane@acme.com:ATATT3xFfGF0..."),
      base64-encoded as-is for the Authorization header. Without it, the Jira
      comment still posts but links show the ticket ID only, not the title.
    required: false
  config-repo:
    description: "Fetch teams config from this GitHub repo (e.g. 'acme-inc/.review-router'). Reads config.yml from the repo root."
    required: false
  config-token:
    description: "GitHub token for reading the config repo. Use when the config repo is in a different org. Falls back to github-token."
    required: false
  config-path:
    description: "Filename to look for in the config repo. Default: config.yml. Use this if your config repo has a different filename (e.g. teams.yml)."
    required: false
    default: "config.yml"
  config-s3:
    description: "Fetch teams config from S3 (e.g. 's3://bucket-name/path/to/config.yml'). Requires AWS credentials in the environment."
    required: false
  ready-label:
    description: "Label name that triggers review routing"
    required: false
    default: "Ready for Review"
  needs-review-prefix:
    description: "Prefix for per-team review labels"
    required: false
    default: "Needs Review"
  needs-review-label-color:
    description: "Hex color for auto-created Needs Review labels"
    required: false
    default: "fbca04"

branding:
  icon: "user-check"
  color: "green"

runs:
  using: "node20"
  main: "dist/index.js"
