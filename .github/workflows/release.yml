name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancel a running release: a half-moved floating tag is worse than a queued one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  retag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # The credentials stay in .git/config because the last step pushes the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]

      - name: Read major version from package.json
        id: version
        run: |
          FULL=$(jq -r .version package.json)
          MAJOR="v$(echo "$FULL" | cut -d. -f1)"
          echo "tag=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "Floating tag: $MAJOR (from $FULL)"

      - name: Force-update floating tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "$TAG" -m "Release $TAG"
          git push origin "$TAG" --force
