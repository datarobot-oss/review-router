name: "Review Router"
description: "Routes code reviews based on CODEOWNERS when Ready for Review label is applied"

inputs:
  github-token:
    description: "GitHub token for API calls. Use a GitHub App installation token for full functionality, or GITHUB_TOKEN for PoC mode."
    required: true
    default: ${{ github.token }}
  slack-token:
    description: "Slack Bot token for sending notifications (optional)"
    required: false
  ready-label:
    description: "Label name that triggers review routing"
    required: false
    default: "Ready for Review"
  needs-review-prefix:
    description: "Prefix for per-team review labels"
    required: false
    default: "Needs Review"
  needs-review-label-color:
    description: "Hex color for auto-created Needs Review labels"
    required: false
    default: "fbca04"

runs:
  using: "node22"
  main: "dist/index.js"
